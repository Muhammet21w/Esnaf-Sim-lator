    <style>
      :root {
        --bg: #0b1220;
        --panel: #151f30;
        --panel2: #1d2a3d;
        --line: #2b3b52;
        --text: #edf4ff;
        --muted: #9aabc2;
        --green: #28d69a;
        --blue: #60a5fa;
        --gold: #f6bd4b;
        --red: #fb7185;
        --purple: #b69cff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at top, #182843, #0b1220 55%);
        color: var(--text);
        font:
          14px system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;

      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        border-radius: 10px;
        padding: 9px 12px;
        font-weight: 800;
        background: var(--blue);
        color: #07111e;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .secondary {
        background: #30435d;
        color: var(--text);
      }
      .success {
        background: var(--green);
        color: #062319;
      }
      .warning {
        background: var(--gold);
        color: #271900;
      }
      .danger {
        background: var(--red);
        color: #310610;
      }
      .purple {
        background: var(--purple);
        color: #1d1238;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #0c1524ed;
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
        padding: 12px max(14px, calc((100vw - 1150px) / 2));
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }
      .brand h1 {
        font-size: 18px;
        margin: 0;
      }
      .brand small {
        color: var(--muted);
      }
      .hud {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 9px;
        border-radius: 12px;
        min-width: 0;
      }
      .stat span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;

      .stat b {
        font-size: 13px;

      }
      .green {
        color: var(--green);
      }
      .gold {
        color: var(--gold);
      }

        color: var(--blue);
      }
      .red {
        color: var(--red);
      }
      .wrap {
        max-width: 1150px;
        margin: auto;
        padding: 15px 14px 95px;
      }
      .tabs {
        display: flex;
        gap: 6px;

      }
      .tabs button {
        white-space: nowrap;

        background: var(--blue);

      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 12px;

      .card {
        background: linear-gradient(145deg, #19263a, #131d2d);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 15px;
        box-shadow: 0 8px 25px #0002;

      }
      .card p {

        line-height: 1.5;
      }
      .card .big {
        font-size: 23px;
        font-weight: 900;
        margin: 7px 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 11px;
      }
      .tag {

        padding: 4px 8px;

        background: #263952;
        color: #cbdcf2;
        font-size: 10px;

      .actions {

        flex-wrap: wrap;
        margin-top: 12px;

      .section-title {

        margin: 8px 0 13px;

        font-size: 19px;

      .list {

        gap: 9px;

        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 12px;

      .item h4 {
        margin: 0 0 5px;
      }
      .item p {
        margin: 3px 0;

      }
      .notice {
        padding: 12px;
        border-radius: 12px;
        background: #172b42;
        border: 1px solid #31516f;
        color: #c9e4ff;
        margin-bottom: 12px;
        line-height: 1.5;
      }
      .input {
        width: 100%;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #0e1725;
        color: white;
        margin: 5px 0 10px;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: #050a13ef;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
      }
      .modal {
        width: min(480px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal h2 {
        margin-top: 0;
      }
      .toast {
        position: fixed;
        bottom: 75px;
        left: 50%;
        transform: translateX(-50%);
        background: #e8f3ff;
        color: #091522;
        padding: 11px 16px;
        border-radius: 12px;
        font-weight: 900;
        z-index: 100;
        box-shadow: 0 5px 25px #0008;
        display: none;
        max-width: 90%;
        text-align: center;
      }
      .bottom {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #0b1422ed;
        border-top: 1px solid var(--line);
        padding: 9px 14px;
        display: flex;
        justify-content: center;
        gap: 8px;
        z-index: 25;
      }
      .bottom button {
        font-size: 11px;
        padding: 9px 12px;
      }
      canvas {
        width: 100% !important;
        height: 120px !important;
        background: #0e1725;
        border-radius: 8px;
        margin-top: 8px;
        border: 1px solid var(--line);
      }
      .hidden {
        display: none !important;
      }
      .online-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--green);
        background: #0d261e;
        padding: 3px 8px;
        border-radius: 12px;
        border: 1px solid #1c4d3b;
      }
      .dot {
        width: 7px;
        height: 7px;
        background: var(--green);
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 0 8px var(--green);
      }
      .netlify-badge {
        margin-bottom: 8px;
        display: block;
      }
    </style>

    <!-- KULLANICI ADI & ŞİFRE GİRİŞ/KAYIT MODALI -->
    <div class="overlay" id="auth">
      <div class="modal">
        <div style="font-size: 35px">🏪</div>
        <h2>Esnaf Simülatör Online v5.4</h2>
        <p class="muted">
          Kullanıcı Adı ve Şifrenizle Giriş Yapın veya Kaydolun
        </p>
        <div
          style="display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap"
        >
          <button
            id="tabRegBtn"
            class="success"
            style="flex: 1"
            onclick="switchAuthMode('register')"
          >

          </button>
          <button
            id="tabLogBtn"

        <div id="registerFlow">

        <div id="loginFlow" class="hidden">

          <input
            class="input"

            type="email"

            placeholder="ornek@eposta.com"
          />
          <label>Şifre</label>

            id="loginPass"

          />

    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const money = (n) => Math.floor(n).toLocaleString("tr-TR") + " ₺";
      const now = () => Date.now();
      const escapeHtml = (value) =>
        String(value).replace(/[&<>"']/g, (char) => {
          const entities = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          };
          return entities[char];
        });
      const SUPABASE_URL = "https://vypfcrbglctkknybpbki.supabase.co";
      const SUPABASE_KEY = "sb_publishable_qCheNYZbue4DDAi4Ci22xQ_orTdx-X8";
      let supabaseClient = null;
      let cloudUser = null;
      let cloudSaveTimer = null;
      let leaderboardData = [];
      let leaderboardError = "";
      function initSupabase() {
        if (window.supabase) {
          supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
          );
        }
      }
      let authMode = "register";
      function switchAuthMode(mode) {
        authMode = mode;
        $("tabRegBtn").className =
          mode === "register" ? "success" : "secondary";
        $("tabLogBtn").className = mode === "login" ? "success" : "secondary";
        $("registerFlow").classList.toggle("hidden", mode !== "register");
        $("loginFlow").classList.toggle("hidden", mode !== "login");
      }
      async function handleRegister() {
        let username = $("regUsername").value.trim();
        let email = $("regEmail").value.trim().toLowerCase();
        let pass = $("regPass").value;
        let confirmPass = $("regPassConfirm").value;
        if (!supabaseClient) {
          toast("❌ Sunucu bağlantısı kurulamadı. Sayfayı yenileyin.");
          return;
        }
        if (
          username.length < 3 ||
          username.length > 24 ||
          !/^[\p{L}\p{N}_ -]+$/u.test(username)
        ) {
          toast(
            "❌ Kullanıcı adı 3-24 karakter olmalı; harf, sayı, boşluk, _ veya - kullanın.",
          );
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          toast("❌ Geçerli bir e-posta adresi girin.");
          return;
        }
        if (pass.length < 6) {
          toast("❌ Şifre en az 6 karakter olmalıdır!");
          return;
        }
        if (pass !== confirmPass) {
          toast("❌ Şifreler uyuşmuyor!");
          return;
        }
        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: pass,
            options: { data: { display_name: username } },
          });
          if (error) throw error;
          if (data.user && data.session) {
            cloudUser = data.user;
            toast("🎉 Hesabınız başarıyla oluşturuldu!");
            await loadCloudGame(username);
          } else if (data.user) {
            toast(
              "📧 Hesabınız açıldı. Oyuna girmek için e-posta adresinizi doğrulayın.",
            );
          }
        } catch (error) {
          toast("❌ Kayıt başarısız: " + error.message);
        }
      }
      async function handleLogin() {
        let email = $("loginEmail").value.trim().toLowerCase();
        let pass = $("loginPass").value;
        if (!supabaseClient) {
          toast("❌ Sunucu bağlantısı kurulamadı. Sayfayı yenileyin.");
          return;
        }
        if (!email || !pass) {
          toast("Lütfen e-posta adresinizi ve şifrenizi girin!");
          return;
        }
        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: pass,
          });
          if (error) throw error;
          if (data.user) {
            cloudUser = data.user;
            toast("🔑 Giriş başarılı! Veriler yükleniyor...");
            await loadCloudGame();
          }
        } catch (error) {
          toast("❌ Giriş Başarısız: Kullanıcı adı veya şifre hatalı!");
        }
      }
      async function loadCloudGame(customUsername) {
        if (!cloudUser) return;
        try {
          let username =
            customUsername ||
            (cloudUser.user_metadata && cloudUser.user_metadata.display_name) ||
            cloudUser.email.split("@")[0];
          const { data, error } = await supabaseClient
            .from("game_saves")
            .select("save_data")
            .eq("user_id", cloudUser.id)
            .maybeSingle();
          if (error) throw error;
          S = defaultState();
          S.username = username;
          S.email = username;
          if (data && data.save_data) {
            S = {
              ...defaultState(),
              ...data.save_data,
              username,
              email: username,
            };
            let elapsedOffline = Math.floor(
              (now() - (S.lastTick || now())) / 1000,
            );
            if (elapsedOffline > 30) {
              let offlineDays = Math.floor(elapsedOffline / 30);
              let totalPassive = 0;
              for (let bId in S.businesses) {
                let cat = businessesCatalog.find((x) => x.id === bId);
                if (cat)
                  totalPassive +=
                    cat.base * S.businesses[bId].level * offlineDays;
              }
              for (let subId in S.subsidiaries) {
                let sub = holdingSubsidiaries.find((x) => x.id === subId);
                if (sub) totalPassive += sub.dividend * offlineDays;
              }
              for (let fId in S.factories) {
                let f = factoriesCatalog.find((x) => x.id === fId);
                if (f) totalPassive += f.dailyProd * offlineDays;
              }
              for (let hId in S.hotels) {
                let h = hotelsCatalog.find((x) => x.id === hId);
                if (h) totalPassive += h.daily * offlineDays;
              }
              for (let eId in S.energies) {
                let en = energyCatalog.find((x) => x.id === eId);
                if (en) totalPassive += en.daily * offlineDays;
              }
              for (let mId in S.mines) {
                let m = miningCatalog.find((x) => x.id === mId);
                if (m) totalPassive += m.daily * offlineDays;
              }
              for (let lId in S.logistics) {
                let l = logisticsCatalog.find((x) => x.id === lId);
                if (l) totalPassive += l.daily * offlineDays;
              }
              for (let crId in S.crypto) {
                let cr = cryptoCatalog.find((x) => x.id === crId);
                if (cr) totalPassive += cr.daily * offlineDays;
              }
              for (let hsId in S.hospitals) {
                let hs = hospitalCatalog.find((x) => x.id === hsId);
                if (hs) totalPassive += hs.daily * offlineDays;
              }
              totalPassive +=
                S.properties.reduce((acc, p) => acc + p.rent, 0) * offlineDays;
              totalPassive +=
                S.vehicles.reduce((acc, v) => acc + v.rent, 0) * offlineDays;
              if (S.bankDeposit > 0) {
                let interestEarned = Math.round(
                  S.bankDeposit * 0.005 * offlineDays,
                );
                S.bankDeposit += interestEarned;
                totalPassive += interestEarned;
              }
              if (totalPassive > 0) {
                S.money += totalPassive;
                toast(
                  `💤 Çevrim dışı kalınan sürede toplam ${money(totalPassive)} kazanç elde edildi!`,
                );
              }
            }
            toast("☁️ Bulut kaydı yüklendi!");
          } else {
            toast("🎮 Yeni profiliniz aktifleşti!");
          }
          $("auth").classList.add("hidden");
          render();
          updateHUD();
          startTicker();
          await saveGame();
          fetchLeaderboard();
        } catch (err) {
          console.error(err);
          cloudUser = null;
          if (supabaseClient)
            await supabaseClient.auth.signOut().catch(console.error);
          const reason = String(
            err?.message || "Bilinmeyen sunucu hatası",
          ).slice(0, 180);
          toast(`⚠️ Sunucu verisi okunamadı: ${reason}`);
        }
      }
      async function saveGame(show = false) {
        if (!cloudUser || !supabaseClient) return;
        clearTimeout(cloudSaveTimer);
        const performSave = async () => {
          try {
            S.lastTick = now();
            const { error } = await supabaseClient.from("game_saves").upsert(
              {
                user_id: cloudUser.id,
                save_data: S,
                updated_at: new Date().toISOString(),
              },
              { onConflict: "user_id" },
            );
            if (error) throw error;
            const { error: leaderboardSaveError } = await supabaseClient
              .from("leaderboard")
              .upsert(
                {
                  user_id: cloudUser.id,
                  username: S.username || "Esnaf",
                  money: Math.floor(S.money),
                  level: S.level,
                  updated_at: new Date().toISOString(),
                },
                { onConflict: "user_id" },
              );
            if (leaderboardSaveError)
              console.error("Leaderboard save error:", leaderboardSaveError);
            if (show) {
              toast(
                leaderboardSaveError
                  ? "☁️ Oyun kaydedildi; sıralama güncellenemedi."
                  : "☁️ Buluta kaydedildi!",
              );
            }
          } catch (error) {
            console.error("Save error:", error);
            if (show) toast("❌ Sunucuya kaydedilemedi!");
          }
        };
        if (show) await performSave();
        else cloudSaveTimer = setTimeout(performSave, 1000);
      }
      async function fetchLeaderboard() {
        if (!supabaseClient) return;
        try {
          const { data, error } = await supabaseClient
            .from("leaderboard")
            .select("username, money, level")
            .order("money", { ascending: false })
            .limit(50);
          if (error) throw error;
          leaderboardData = (data || []).map((item) => ({
            username: item.username || "Bilinmeyen Esnaf",
            money: Number(item.money) || 0,
            level: Number(item.level) || 1,
          }));
          leaderboardError = "";
          if (active === "leaderboard") render();
        } catch (err) {
          console.error("Leaderboard error:", err);
          leaderboardData = [];
          leaderboardError =
            "Sıralama henüz hazır değil. Supabase tablo kurulumunu kontrol edin.";
          if (active === "leaderboard") render();
        }

      function drawStockCharts() {
        stockTickers.forEach((s) => {
          let c = $("chart_" + s.id);
          if (!c) return;
          let ctx = c.getContext("2d");
          c.width = c.offsetWidth;
          c.height = 120;
          ctx.clearRect(0, 0, c.width, c.height);
          ctx.beginPath();
          ctx.strokeStyle = "#28d69a";
          ctx.lineWidth = 2;
          s.history.forEach((v, i) => {
            let x = i * (c.width / (s.history.length - 1));
            let y = c.height - (v / 3500) * c.height;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
        });
      }
      function gameTick() {
        let ct = now(),
          elapsed = (ct - S.lastTick) / 1000;
        if (elapsed < 1) return;
        S.lastTick = ct;
        if (S.energy < S.maxEnergy) {
          S.energy = Math.min(S.maxEnergy, S.energy + elapsed * 0.4);
        }
        for (let id in S.activeJobs) {
          let j = S.activeJobs[id];
          j.rem -= elapsed;
          if (j.rem <= 0) {
            changeMoney(j.pay, "Maaş");
            addXP(j.xp);
            toast(`✅ İş tamamlandı! +${money(j.pay)}`);
            delete S.activeJobs[id];
          }
        }
        for (let id in S.activeTenders) {
          let t = S.activeTenders[id];
          t.rem -= elapsed;
          if (t.rem <= 0) {
            changeMoney(t.reward, "İhale Ödülü");
            toast(`🏛️ İhale tamamlandı! +${money(t.reward)}`);
            delete S.activeTenders[id];
          }
        }
        for (let id in S.activeConstructions) {
          let c = S.activeConstructions[id];
          c.rem -= elapsed;
          let cat = constructionCatalog.find((x) => x.id === id);
          if (c.rem <= 0) {
            changeMoney(cat.reward, "İnşaat Ödülü");
            toast(`🚜 ${cat.name} tamamlandı! +${money(cat.reward)}`);
            delete S.activeConstructions[id];
          }
        }
        dayTimer += elapsed;
        if (dayTimer >= 30) {
          dayTimer = 0;
          S.day++;
          if (S.day % 365 === 0) S.age++;
          if (S.heirName) S.heirAge++;
          let busIncome = Object.keys(S.businesses).reduce((acc, bId) => {
            let cat = businessesCatalog.find((x) => x.id === bId);
            return acc + (cat ? cat.base * S.businesses[bId].level : 0);
          }, 0);
          let subIncome = Object.keys(S.subsidiaries).reduce((acc, subId) => {
            let sub = holdingSubsidiaries.find((x) => x.id === subId);
            return acc + (sub ? sub.dividend : 0);
          }, 0);
          let facIncome = Object.keys(S.factories).reduce((acc, fId) => {
            let f = factoriesCatalog.find((x) => x.id === fId);
            return acc + (f ? f.dailyProd : 0);
          }, 0);
          let cryptoIncome = Object.keys(S.crypto).reduce((acc, crId) => {
            let cr = cryptoCatalog.find((x) => x.id === crId);
            return acc + (cr ? cr.daily : 0);
          }, 0);
          let hospitalIncome = Object.keys(S.hospitals).reduce((acc, hsId) => {
            let hs = hospitalCatalog.find((x) => x.id === hsId);
            return acc + (hs ? hs.daily : 0);
          }, 0);
          let hotelIncome = Object.keys(S.hotels).reduce((acc, hId) => {
            let h = hotelsCatalog.find((x) => x.id === hId);
            return acc + (h ? h.daily : 0);
          }, 0);
          let energyIncome = Object.keys(S.energies).reduce((acc, eId) => {
            let en = energyCatalog.find((x) => x.id === eId);
            return acc + (en ? en.daily : 0);
          }, 0);
          let mineIncome = Object.keys(S.mines).reduce((acc, mId) => {
            let m = miningCatalog.find((x) => x.id === mId);
            return acc + (m ? m.daily : 0);
          }, 0);
          let logIncome = Object.keys(S.logistics).reduce((acc, lId) => {
            let l = logisticsCatalog.find((x) => x.id === lId);
            return acc + (l ? l.daily : 0);
          }, 0);
          let propIncome = S.properties.reduce((acc, p) => acc + p.rent, 0);
          let vehIncome = S.vehicles.reduce((acc, v) => acc + v.rent, 0);
          let totalIncome =
            busIncome +
            subIncome +
            facIncome +
            cryptoIncome +
            hospitalIncome +
            hotelIncome +
            energyIncome +
            mineIncome +
            logIncome +
            propIncome +
            vehIncome;
          let staffExpense = S.staff.length * 15000;
          let netTotal = totalIncome - staffExpense;
          if (netTotal > 0) changeMoney(netTotal, "Net Günlük Gelir");
          if (S.bankDeposit > 0) {
            S.bankDeposit += Math.round(S.bankDeposit * 0.005);
          }
          S.taxDebt += Math.round(totalIncome * 0.12);
          S.farm.milk += S.farm.cow * 15;
          S.farm.egg += S.farm.chicken * 10;
          stockTickers.forEach((s) => {
            let delta = (Math.random() - 0.48) * s.volatility * s.price;
            s.price = Math.max(10, Math.round(s.price + delta));
            s.history.push(s.price);
            if (s.history.length > 10) s.history.shift();
          });
          if (Math.random() < 0.25) {
            const events = [
              {
                msg: "📈 Borsa rallisi gerçekleşti! Tüm hisseler değer kazandı.",
                action: () =>
                  stockTickers.forEach(
                    (s) => (s.price = Math.round(s.price * 1.15)),
                  ),
              },
              {
                msg: "🏛️ Hükümetten KOBİ teşviki açıklandı: +100.000 ₺ hibe!",
                action: () => changeMoney(100000, "Teşvik"),
              },
              {
                msg: "⚠️ Ekonomik dalgalanma! Piyasalarda geçici durgunluk yaşandı.",
              },
            ];
            let ev = events[Math.floor(Math.random() * events.length)];
            if (ev.action) ev.action();
            toast(`📢 Piyasalar: ${ev.msg}`);
          }
          toast(`🌅 Gün ${S.day} başladı. Net gelir: ${money(netTotal)}`);
          saveGame();
        }
        updateHUD();
        render();
      }
      function startJob(id) {
        let j = jobs.find((x) => x.id === id);
        if (S.level < j.level || S.rep < j.repReq) {
          toast(`❌ Seviye ${j.level} ve ${j.repReq} İtibar gerekli!`);
          return;
        }
        if (S.energy < j.energy) {
          toast("❌ Enerji yetersiz!");
          return;
        }
        if (S.activeJobs[id]) return;
        S.energy -= j.energy;
        S.activeJobs[id] = { pay: j.pay, xp: j.xp, rem: j.time };
        toast(`💼 İş başladı!`);
        updateHUD();
        render();
      }
      function buyBusiness(id) {
        let b = businessesCatalog.find((x) => x.id === id);
        if (S.rep < b.reqRep) {
          toast(`❌ Bu işletme için ${b.reqRep} itibar puanı gerekiyor!`);
          return;
        }
        let cost = S.subsidiesActive ? Math.round(b.price * 0.7) : b.price;
        if (S.businesses[id]) {
          if (changeMoney(-Math.round(cost * 0.5), "Geliştirme"))
            S.businesses[id].level++;
        } else {
          if (changeMoney(-cost, "Satın Alma")) S.businesses[id] = { level: 1 };
        }
        saveGame(true);
        render();
      }

          S.crypto[id] = true;
          toast(`🪙 ${cr.name} kuruldu!`);
          saveGame(true);
          render();
        }
      }
      function buyHospital(id) {
        let hs = hospitalCatalog.find((x) => x.id === id);
        let cost = S.subsidiesActive ? Math.round(hs.cost * 0.7) : hs.cost;
        if (changeMoney(-cost, "Hastane Yatırımı")) {
          S.hospitals[id] = true;
          toast(`🏥 ${hs.name} hizmete girdi!`);
          saveGame(true);
          render();
        }
      }
      function buyHotel(id) {
        let h = hotelsCatalog.find((x) => x.id === id);
        let cost = S.subsidiesActive ? Math.round(h.cost * 0.7) : h.cost;
        if (changeMoney(-cost, "Otel Yatırımı")) {
          S.hotels[id] = true;
          toast(`🏨 ${h.name} satın alındı!`);
          saveGame(true);
          render();
        }
      }
      function buyEnergy(id) {
        let e = energyCatalog.find((x) => x.id === id);
        let cost = S.subsidiesActive ? Math.round(e.cost * 0.7) : e.cost;
        if (changeMoney(-cost, "Enerji Yatırımı")) {
          S.energies[id] = true;
          toast(`⚡ ${e.name} kuruldu!`);
          saveGame(true);
          render();
        }
      }
      function buyMine(id) {
        let m = miningCatalog.find((x) => x.id === id);
        let cost = S.subsidiesActive ? Math.round(m.cost * 0.7) : m.cost;
        if (changeMoney(-cost, "Maden Ruhsatı")) {
          S.mines[id] = true;
          toast(`⛏️ ${m.name} ruhsatı alındı!`);
          saveGame(true);
          render();
        }
      }
      function startConstruction(id) {
        let c = constructionCatalog.find((x) => x.id === id);
        if (S.activeConstructions[id]) return;
        if (changeMoney(-c.cost, "İnşaat Maliyeti")) {
          S.activeConstructions[id] = { rem: c.time };
          toast("🚜 İnşaat projesi başlatıldı!");
          saveGame(true);
          render();
        }
      }
      function buyLogistics(id) {
        let l = logisticsCatalog.find((x) => x.id === id);
        if (changeMoney(-l.cost, "Lojistik Yatırımı")) {
          S.logistics[id] = true;
          toast(`📦 ${l.name} kuruldu!`);
          saveGame(true);
          render();
        }
      }
      function buyVehicle(id) {
        let v = garageCatalog.find((x) => x.id === id);
        if (changeMoney(-v.price, "Araç Alımı")) {
          S.vehicles.push(v);
          toast(`🚗 ${v.name} garaja eklendi!`);
          saveGame(true);
          render();
        }
      }
      function sellVehicle(index) {
        if (S.vehicles[index]) {
          let v = S.vehicles[index];
          changeMoney(Math.round(v.price * 0.75), "Araç Satışı");
          S.vehicles.splice(index, 1);
          toast("Araç galeriye satıldı.");
          saveGame(true);
          render();
        }
      }
      function buyProperty(id) {
        let p = propertyCatalog.find((x) => x.id === id);
        if (changeMoney(-p.price, "Emlak Yatırımı")) {
          S.properties.push(p);
          toast(`🏘️ ${p.name} portföye eklendi!`);
          saveGame(true);
          render();
        }
      }
      function sellProperty(index) {
        if (S.properties[index]) {
          let p = S.properties[index];
          changeMoney(Math.round(p.price * 0.8), "Gayrimenkul Satışı");
          S.properties.splice(index, 1);
          toast("Mülk satıldı.");
          saveGame(true);
          render();
        }
      }
      function buyFarmAnimal(type) {
        let costs = { chicken: 5000, sheep: 25000, cow: 90000 };
        if (changeMoney(-costs[type], "Hayvan Alımı")) {
          S.farm[type]++;
          toast("Hayvan çiftliğe eklendi!");
          saveGame(true);
          render();
        }
      }
      function harvestFarm() {
        let rev = S.farm.milk * 25 + S.farm.egg * 10;
        changeMoney(rev, "Tarım ve Süt Satışı");
        S.farm.milk = 0;
        S.farm.egg = 0;
        toast(`🌾 Ürünler satıldı: +${money(rev)}`);
        saveGame(true);
        render();
      }
      function hireStaff(role) {
        if (changeMoney(-25000, "Personel İşe Alım")) {
          S.staff.push({ role });
          toast("Yeni personel işe alındı.");
          saveGame(true);
          render();
        }
      }
      function fireStaff() {
        if (S.staff.length > 0) {
          S.staff.pop();
          toast("Personel işten çıkarıldı.");
          saveGame(true);
          render();
        }
      }
      function eatDish(id) {
        let d = localDishes.find((x) => x.id === id);
        if (changeMoney(-d.cost, "Yöresel Lezzet")) {
          S.energy = Math.min(S.maxEnergy, S.energy + d.energy);
          updateHUD();
          toast(`😋 ${d.name} yendi! Enerji +${d.energy} arttı.`);
        }
      }
      function startTender(id) {
        let t = tendersList.find((x) => x.id === id);
        if (S.activeTenders[id]) return;
        if (changeMoney(-t.cost, "İhale")) {
          S.activeTenders[id] = { reward: t.reward, rem: t.time };
          toast("🏛️ İhale alındı!");
          saveGame(true);
          render();
        }
      }
      function buyStock(id, count) {
        let s = stockTickers.find((x) => x.id === id);
        let totalCost = s.price * count;
        if (changeMoney(-totalCost, "Hisse Alımı")) {
          S.portfolio[id].shares += count;
          toast(`${count} Lot ${id} alındı.`);
          saveGame(true);
          render();
        }
      }
      function sellStock(id, count) {
        let s = stockTickers.find((x) => x.id === id);
        if (S.portfolio[id].shares >= count) {
          S.portfolio[id].shares -= count;
          changeMoney(s.price * count, "Hisse Satışı");
          toast(`${count} Lot ${id} satıldı.`);
          saveGame(true);
          render();
        } else {
          toast("❌ Yeterli lotunuz yok!");
        }
      }
      function depositMoney() {
        if (changeMoney(-100000, "Mevduat Yatırma")) {
          S.bankDeposit += 100000;
          saveGame(true);
          render();
        }
      }
      function withdrawMoney() {
        if (S.bankDeposit >= 100000) {
          S.bankDeposit -= 100000;
          changeMoney(100000, "Mevduat Çekme");
          saveGame(true);
          render();
        } else {
          toast("❌ Bankada yeterli mevduat yok!");
        }
      }
      function takeLoan() {
        if (S.loan === 0) {
          S.loan = 500000;
          S.loanInstallment = 100000;
          changeMoney(500000, "Kredi");
          toast("500.000 ₺ banka kredisi çekildi.");
          saveGame(true);
          render();
        } else {
          toast("Zaten aktif krediniz var.");
        }
      }
      function payLoanInstallment() {
        if (S.loan > 0) {
          let payAmt = Math.min(S.loan, S.loanInstallment);
          if (changeMoney(-payAmt, "Kredi Taksiti")) {
            S.loan -= payAmt;
            toast("Kredi taksiti ödendi.");
            saveGame(true);
            render();
          }
        } else {
          toast("Kredi borcunuz yok.");
        }
      }
      function payFullLoan() {
        if (S.loan > 0) {
          if (changeMoney(-S.loan, "Kredi Kapatma")) {
            S.loan = 0;
            S.loanInstallment = 0;
            toast("Kredi borcunun tamamı kapatıldı!");
            saveGame(true);
            render();
          }
        } else {
          toast("Kredi borcunuz yok.");
        }
      }
      function payTax() {
        if (S.taxDebt <= 0) {
          toast("Vergi borcunuz yok.");
          return;
        }
        if (changeMoney(-S.taxDebt, "Vergi Ödemesi")) {
          S.taxDebt = 0;
          toast("Vergi borcu ödendi!");
          saveGame(true);
          render();
        }
      }
      function restructureTax() {
        if (S.taxDebt > 0) {
          S.taxDebt = Math.round(S.taxDebt * 0.9);
          toast("Vergi borcu %10 indirimle yapılandırıldı.");
          saveGame(true);
          render();
        } else {
          toast("Vergi borcunuz yok.");
        }
      }
      function claimSubsidies() {
        if (!S.subsidiesActive) {
          S.subsidiesActive = true;
          changeMoney(500000, "Teşvik");
          toast("Devlet teşviki alındı! (%30 indirim aktif)");
          saveGame(true);
          render();
        }
      }
      function adoptChild() {
        if (changeMoney(-1000000, "Varis")) {
          S.heirName = S.username + " Jr.";
          S.heirAge = 0;
          toast("Varis dünyaya geldi!");
          saveGame(true);
          render();
        }
      }
      function transferLegacy() {
        if (!S.heirName) return;
        S.username = S.heirName;
        S.age = S.heirAge < 25 ? 25 : S.heirAge;
        S.heirName = null;
        S.heirAge = 0;
        saveGame(true);
        toast("👑 Holding varise başarıyla devredildi!");
        location.reload();
      }
      function drinkTea() {
        if (changeMoney(-250, "Çay")) {
          S.energy = Math.min(S.maxEnergy, S.energy + 35);
          updateHUD();
          toast("☕ Çay içildi, enerji tazelendi!");
        }
      }
      function startTicker() {
        if (tickHandle) clearInterval(tickHandle);
        tickHandle = setInterval(gameTick, 1000);
      }
    </script>
  </body>
</html>
